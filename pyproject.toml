[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planning-optimizer"
version = "0.1.0"
description = "Local-first resource-constrained planning prototype"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8,<4",
  "jsonschema>=4.20,<5",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "scipy>=1.11,<2",
  "streamlit>=1.41,<2",
]

[project.scripts]
planning-optimizer = "planning_optimizer.cli:main"

[tool.setuptools.packages.find]
include = ["planning_optimizer*"]
